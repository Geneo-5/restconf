#---------------------------------------------------------------------
# HAProxy pour RESTCONF
#
# - Terminaison TLS côté client
# - HTTP/2 over TLS côté client
# - Connexion au backend RESTCONF via socket Unix
# - Backend supposé parler h2c prior knowledge sur la socket Unix
# - Support des flux SSE longs
#---------------------------------------------------------------------

global
    log /dev/log local0
    # log /dev/log local1 notice

    # Ajuster selon la charge attendue
    maxconn 20000

    # Utile si gros headers JWT ou gros corps RESTCONF
    # Optionnel : à adapter selon tes besoins
    tune.bufsize 65536

    # Options HTTP/2 optionnelles selon version HAProxy
    # Si ces lignes sont rejetées par ta version, retire-les.
    tune.h2.max-concurrent-streams 100
    tune.h2.initial-window-size 1048576

    # TLS minimum côté client
    ssl-default-bind-options ssl-min-ver TLSv1.2

    # Si HAProxy tourne sous systemd, évite "daemon" ici.
    daemon

defaults
    mode http
    log global

    option httplog
    option dontlognull
    option http-no-delay

    # Timeouts adaptés aux flux RESTCONF/SSE.
    #
    # IMPORTANT :
    # - timeout client  : inactivité côté client
    # - timeout server  : inactivité côté backend
    # - timeout tunnel  : connexions longues de type tunnel/streaming
    #
    # Si tu n'envoies pas de heartbeat SSE, mets des valeurs très hautes.
    # Si tu envoies un heartbeat toutes les 30s, 5m ou 1h est confortable.
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

    # Timeouts HTTP plus courts pour les requêtes normales
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout queue 30s

    # Détection des fermetures partielles
    timeout client-fin 30s
    timeout server-fin 30s

    retries 2

#---------------------------------------------------------------------
# Frontend HTTPS public
#---------------------------------------------------------------------
frontend restconf_https
    # Adapter le certificat :
    # - certificat serveur TLS
    # - clé privée
    #
    # ALPN :
    # - h2 pour HTTP/2
    # - http/1.1 pour compatibilité
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/restconf.pem
    # bind quic4@:443 ssl crt /etc/haproxy/certs/restconf.pem

    # 'Alt-Svc' header invites client to switch to the QUIC protocol
    # Max age (ma) is set to 15 minutes (900 seconds), but
    # can be increased once verified working as expected
    #http-response set-header alt-svc "h3=\":443\";ma=900;"

    # Headers utiles pour le backend
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]

    # Sécurité HTTP basique
    http-response set-header X-Content-Type-Options nosniff

    # Optionnel : ne pas mettre en cache les réponses RESTCONF
    http-response set-header Cache-Control no-store

    # Optionnel : limiter les chemins acceptés
    # acl restconf_path path_beg /restconf /.well-known/host-meta
    # http-request deny deny_status 404 unless restconf_path

    redirect scheme https code 301 unless { ssl_fc }
    default_backend restconf_backend

#---------------------------------------------------------------------
# Backend RESTCONF sur socket Unix
#---------------------------------------------------------------------
backend restconf_backend
    # Pas de répartition si un seul backend
    balance first

    # Important pour les flux SSE / notifications
    option http-no-delay

    # Backend en h2c sur socket Unix.
    #
    # "proto h2" indique à HAProxy de parler HTTP/2 en clair (h2c)
    # au backend, sans TLS.
    #
    # Si ton backend parle seulement HTTP/1.1 sur la socket Unix,
    # retire "proto h2".
    server restconf unix@/run/restconf.socket proto h2 maxconn 5000

    # Variante HTTP/1.1 seulement :
    # server restconf unix@/run/restconf.socket maxconn 5000

    # Pas de healthcheck HTTP activé ici volontairement.
    #
    # Si tu veux un healthcheck, il faudra t'assurer que :
    # - le backend accepte le healthcheck sans JWT ;
    # - le protocole de check correspond à ce que le backend attend ;
    # - le chemin testé est valide.
    #
    # Exemple prudent, seulement si /.well-known/host-meta est public :
    #
    # option httpchk GET /.well-known/host-meta
    # http-check expect status 200
    # server restconf unix@/run/restconf.socket proto h2 check maxconn 5000
